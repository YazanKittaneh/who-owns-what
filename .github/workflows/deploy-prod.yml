name: Deploy Prod

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  COMPOSE_BAKE: 'true'

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'client/**'
      - 'wow/**'
      - 'project/**'
      - 'jfauthprovider/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'Dockerfile.prod'
      - 'client/Dockerfile.prod'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-prod.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  determine-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy_api: ${{ steps.detect.outputs.deploy_api }}
      deploy_frontend: ${{ steps.detect.outputs.deploy_frontend }}
      frontend_only: ${{ steps.detect.outputs.frontend_only }}
      backend_only: ${{ steps.detect.outputs.backend_only }}
      api_image: ${{ steps.meta.outputs.api_image }}
      api_image_latest: ${{ steps.meta.outputs.api_image_latest }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
      frontend_image_latest: ${{ steps.meta.outputs.frontend_image_latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Determine changed services
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          deploy_api=false
          deploy_frontend=false

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            deploy_api=true
            deploy_frontend=true
          else
            before_sha="${{ github.event.before }}"
            if [ -z "$before_sha" ] || [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
              changed_files=$(git diff --name-only HEAD^ HEAD)
            else
              changed_files=$(git diff --name-only "$before_sha" "$GITHUB_SHA")
            fi

            echo "=== Changed files ==="
            printf '%s\n' "$changed_files"

            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$file" in
                client/*|client/Dockerfile.prod)
                  deploy_frontend=true
                  ;;
                wow/*|project/*|jfauthprovider/*|tests/*|requirements*.txt|Dockerfile.prod)
                  deploy_api=true
                  ;;
                docker-compose.prod.yml|.github/workflows/deploy-prod.yml|.github/workflows/ci.yml|.dockerignore)
                  deploy_api=true
                  deploy_frontend=true
                  ;;
              esac
            done <<< "$changed_files"
          fi

          frontend_only=false
          backend_only=false
          if [ "$deploy_frontend" = true ] && [ "$deploy_api" = false ]; then
            frontend_only=true
          fi
          if [ "$deploy_api" = true ] && [ "$deploy_frontend" = false ]; then
            backend_only=true
          fi

          echo "deploy_api=$deploy_api" >> "$GITHUB_OUTPUT"
          echo "deploy_frontend=$deploy_frontend" >> "$GITHUB_OUTPUT"
          echo "frontend_only=$frontend_only" >> "$GITHUB_OUTPUT"
          echo "backend_only=$backend_only" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "api_image=ghcr.io/$owner/who-owns-what-api:prod-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "api_image_latest=ghcr.io/$owner/who-owns-what-api:prod-latest" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/$owner/who-owns-what-frontend:prod-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_image_latest=ghcr.io/$owner/who-owns-what-frontend:prod-latest" >> "$GITHUB_OUTPUT"

  build-images:
    needs: determine-changes
    if: needs.determine-changes.outputs.deploy_api == 'true' || needs.determine-changes.outputs.deploy_frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push API image
        if: needs.determine-changes.outputs.deploy_api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ needs.determine-changes.outputs.api_image }}
            ${{ needs.determine-changes.outputs.api_image_latest }}
          cache-from: type=gha,scope=wow-prod-api
          cache-to: type=gha,mode=max,scope=wow-prod-api

      - name: Build and push frontend image
        if: needs.determine-changes.outputs.deploy_frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile.prod
          push: true
          build-args: |
            REACT_APP_API_BASE_URL=https://wow-api.yazan.io
            REACT_APP_ROLLBAR_ACCESS_TOKEN=
            BUILD_GIT_SHA=${{ github.sha }}
          tags: |
            ${{ needs.determine-changes.outputs.frontend_image }}
            ${{ needs.determine-changes.outputs.frontend_image_latest }}
          cache-from: type=gha,scope=wow-prod-frontend-v2
          cache-to: type=gha,mode=max,scope=wow-prod-frontend-v2

      - name: Verify pushed frontend image contents
        if: needs.determine-changes.outputs.deploy_frontend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${{ needs.determine-changes.outputs.frontend_image }}"
          docker run --rm "${{ needs.determine-changes.outputs.frontend_image }}" sh -c '
            test -f /usr/share/nginx/html/index.html
            test -d /usr/share/nginx/html/static/js
            test -d /usr/share/nginx/html/static/css
            grep -Eq "/static/js/main\.[a-f0-9]+\.chunk\.js" /usr/share/nginx/html/index.html
            grep -Eq "/static/css/main\.[a-f0-9]+\.chunk\.css" /usr/share/nginx/html/index.html
          '

  deploy:
    needs: [determine-changes, build-images]
    if: needs.determine-changes.outputs.deploy_api == 'true' || needs.determine-changes.outputs.deploy_frontend == 'true'
    runs-on: [self-hosted, linux, x64, production]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Deploy prod stack
        env:
          COMPOSE_PROJECT_NAME: who-owns-what-prod
          ENV_FILE_PATH: /home/actions/who-owns-what-prod.env
          PUBLIC_FRONTEND_URL: https://wow.yazan.io
          PUBLIC_API_HEALTH_URL: https://wow-api.yazan.io/api/health/
          API_IMAGE: ${{ needs.determine-changes.outputs.api_image }}
          FRONTEND_IMAGE: ${{ needs.determine-changes.outputs.frontend_image }}
          BUILD_GIT_SHA: ${{ github.sha }}
          DEPLOY_API: ${{ needs.determine-changes.outputs.deploy_api }}
          DEPLOY_FRONTEND: ${{ needs.determine-changes.outputs.deploy_frontend }}
          FRONTEND_ONLY: ${{ needs.determine-changes.outputs.frontend_only }}
          BACKEND_ONLY: ${{ needs.determine-changes.outputs.backend_only }}
        run: |
          set -euo pipefail

          compose=(docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file .env -f docker-compose.prod.yml --profile with-cloudflare)

          if [ ! -f "$ENV_FILE_PATH" ]; then
            echo "❌ Missing $ENV_FILE_PATH on runner"
            exit 1
          fi

          cp "$ENV_FILE_PATH" .env

          echo "=== Deploying prod stack ==="
          if [ "$FRONTEND_ONLY" = "true" ]; then
            echo "Deploy mode: frontend only"
            "${compose[@]}" pull frontend
            "${compose[@]}" up -d --no-deps --no-build frontend
          elif [ "$BACKEND_ONLY" = "true" ]; then
            echo "Deploy mode: api only"
            "${compose[@]}" pull api
            "${compose[@]}" up -d --no-deps --no-build api
          else
            echo "Deploy mode: full stack"
            "${compose[@]}" pull api frontend
            "${compose[@]}" up -d --no-build api frontend cloudflared
          fi

          api_container_id=$("${compose[@]}" ps -q api)
          frontend_container_id=$("${compose[@]}" ps -q frontend)

          if [ -z "$api_container_id" ] || [ -z "$frontend_container_id" ]; then
            echo "❌ Could not determine prod container ids after deploy"
            "${compose[@]}" ps
            exit 1
          fi

          docker image prune -f

          echo "Waiting for local API health check..."
          for attempt in {1..18}; do
            if docker exec "$api_container_id" curl -fsS http://127.0.0.1:8000/api/health/ > /dev/null; then
              echo "✅ Local API health check passed"
              break
            fi
            echo "Local API health not ready yet (attempt ${attempt}/18)."
            sleep 10
          done

          if ! docker exec "$api_container_id" curl -fsS http://127.0.0.1:8000/api/health/ > /dev/null; then
            echo "❌ Local API health check failed"
            "${compose[@]}" logs --tail=100 api
            exit 1
          fi

          local_html=$(mktemp)
          public_html=$(mktemp)
          trap 'rm -f "$local_html" "$public_html"' EXIT

          extract_assets() {
            python3 -c 'import pathlib, re, sys; html = pathlib.Path(sys.argv[1]).read_text(errors="ignore"); patterns = [r"/static/js/main\.[a-f0-9]+\.chunk\.js", r"/static/css/main\.[a-f0-9]+\.chunk\.css"]; [print((re.search(pattern, html).group(0) if re.search(pattern, html) else "")) for pattern in patterns]' "$1"
          }

          if [ "$DEPLOY_FRONTEND" = "true" ]; then
            echo "Waiting for local frontend shell..."
            for attempt in {1..18}; do
              if docker exec "$frontend_container_id" wget -qO- http://127.0.0.1/ > "$local_html"; then
                mapfile -t local_assets < <(extract_assets "$local_html")
                local_js=${local_assets[0]:-}
                local_css=${local_assets[1]:-}
                if [ -n "$local_js" ] && [ -n "$local_css" ]; then
                  echo "Local frontend assets: $local_js | $local_css"
                  break
                fi
              fi
              echo "Local frontend shell not ready yet (attempt ${attempt}/18)."
              sleep 5
            done

            if [ -z "${local_js:-}" ] || [ -z "${local_css:-}" ]; then
              echo "❌ Could not determine local frontend asset hashes"
              "${compose[@]}" logs --tail=100 frontend
              exit 1
            fi
          fi

          echo "Waiting for public API health on $PUBLIC_API_HEALTH_URL ..."
          for attempt in {1..18}; do
            if curl -fsSL "$PUBLIC_API_HEALTH_URL" > /dev/null; then
              echo "✅ Public API health check passed"
              break
            fi
            echo "Public API not ready yet (attempt ${attempt}/18)."
            sleep 10
          done

          if ! curl -fsSL "$PUBLIC_API_HEALTH_URL" > /dev/null; then
            echo "❌ Public API health check failed"
            exit 1
          fi

          if [ "$DEPLOY_FRONTEND" = "true" ]; then
            echo "Waiting for $PUBLIC_FRONTEND_URL to serve the rebuilt frontend assets..."
            for attempt in {1..24}; do
              if curl -fsSL -A "Mozilla/5.0" "$PUBLIC_FRONTEND_URL/" > "$public_html"; then
                mapfile -t public_assets < <(extract_assets "$public_html")
                public_js=${public_assets[0]:-}
                public_css=${public_assets[1]:-}
                if [ "$public_js" = "$local_js" ] && [ "$public_css" = "$local_css" ]; then
                  echo "✅ Prod frontend is serving the rebuilt assets"
                  echo "Public assets: $public_js | $public_css"
                  exit 0
                fi
                echo "Public assets do not match yet: ${public_js:-missing} | ${public_css:-missing}"
              else
                echo "Public frontend request failed (attempt ${attempt}/24)."
              fi
              sleep 10
            done

            echo "❌ Prod frontend never served the rebuilt assets"
            echo "Expected local assets: $local_js | $local_css"
            echo "Last public assets: ${public_js:-missing} | ${public_css:-missing}"
            "${compose[@]}" logs --tail=100 frontend cloudflared
            exit 1
          fi

          echo "✅ Prod deploy completed"
