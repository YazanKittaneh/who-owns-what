name: CI

on:
  pull_request:
    branches:
      - develop
      - main
      - master
  push:
    branches:
      - develop
      - main
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: wow
          POSTGRES_PASSWORD: wow
          POSTGRES_DB: wow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wow -d wow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run backend tests
        run: pytest
        env:
          SECRET_KEY: ci-secret-key
          ALERTS_API_TOKEN: ci-alerts-token
          SIGNATURE_API_TOKEN: ci-signature-token
          ADMIN_API_TOKEN: ci-admin-token
          DATABASE_URL: postgres://wow:wow@127.0.0.1:5432/wow
          TEST_DATABASE_URL: postgres://wow:wow@127.0.0.1:5432/wow_test

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: client/yarn.lock

      - name: Install frontend dependencies
        working-directory: client
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: client
        run: yarn build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          TSC_COMPILE_ON_ERROR: 'true'
          REACT_APP_API_BASE_URL: https://wow-api.yazan.io
          REACT_APP_STREETVIEW_API_KEY: ${{ secrets.REACT_APP_STREETVIEW_API_KEY }}
          REACT_APP_AMPLITUDE_API_KEY: ${{ secrets.REACT_APP_AMPLITUDE_API_KEY }}
          REACT_APP_ROLLBAR_ACCESS_TOKEN: ${{ secrets.REACT_APP_ROLLBAR_ACCESS_TOKEN }}
          REACT_APP_ALGOLIA_APP_ID: ${{ secrets.REACT_APP_ALGOLIA_APP_ID }}
          REACT_APP_ALGOLIA_SEARCH_KEY: ${{ secrets.REACT_APP_ALGOLIA_SEARCH_KEY }}
