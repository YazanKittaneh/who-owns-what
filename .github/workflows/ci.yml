name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    branches:
      - develop
      - main
      - master
  push:
    branches:
      - develop
      - main
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: wow
          POSTGRES_PASSWORD: wow
          POSTGRES_DB: wow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wow -d wow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting (black)
        run: black --check .

      - name: Lint (flake8)
        run: flake8

      - name: Type-check (mypy)
        run: mypy .
        env:
          SECRET_KEY: ci-secret-key

      - name: Run backend tests
        run: pytest tests --ignore=tests/test_sql.py
        env:
          SECRET_KEY: ci-secret-key
          ALERTS_API_TOKEN: ci-alerts-token
          SIGNATURE_API_TOKEN: ci-signature-token
          ADMIN_API_TOKEN: ci-admin-token
          DATABASE_URL: postgres://wow:wow@127.0.0.1:5432/wow
          TEST_DATABASE_URL: postgres://wow:wow@127.0.0.1:5432/wow_test

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: client/yarn.lock

      - name: Install frontend dependencies
        working-directory: client
        run: yarn install --frozen-lockfile

      - name: Check formatting (prettier)
        working-directory: client
        run: yarn prettier:check

      - name: Type-check (tsc)
        working-directory: client
        run: yarn typecheck

      # NOTE: yarn test is not run here yet — the CRA 4 jest toolchain is
      # broken by dependency drift (bundled Babel 7.12 vs plugins requiring
      # 7.22). Restore a test step as part of the toolchain migration
      # tracked in issue #20.
      - name: Build frontend
        working-directory: client
        run: yarn build
        env:
          BUILD_GIT_SHA: ${{ github.sha }}
          NODE_OPTIONS: --openssl-legacy-provider
          REACT_APP_API_BASE_URL: https://wow-api.yazan.io
          REACT_APP_STREETVIEW_API_KEY: ${{ secrets.REACT_APP_STREETVIEW_API_KEY }}
          REACT_APP_AMPLITUDE_API_KEY: ${{ secrets.REACT_APP_AMPLITUDE_API_KEY }}
          REACT_APP_ROLLBAR_ACCESS_TOKEN: ${{ secrets.REACT_APP_ROLLBAR_ACCESS_TOKEN }}
          REACT_APP_ALGOLIA_APP_ID: ${{ secrets.REACT_APP_ALGOLIA_APP_ID }}
          REACT_APP_ALGOLIA_SEARCH_KEY: ${{ secrets.REACT_APP_ALGOLIA_SEARCH_KEY }}
