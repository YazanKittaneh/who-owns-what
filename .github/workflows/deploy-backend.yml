name: Build and Deploy Backend

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'requirements*.txt'
      - 'project/**'
      - 'wow/**'
      - 'jfauthprovider/**'
      - 'Dockerfile.prod'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and test the Docker image
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Deploy to production server
  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, production]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy locally on production runner
        env:
          COMPOSE_PROJECT_NAME: who-owns-what
        run: |
          set -euo pipefail

          if [ ! -f /home/actions/who-owns-what.env ]; then
            echo "❌ Missing /home/actions/who-owns-what.env on production runner"
            exit 1
          fi

          cp /home/actions/who-owns-what.env .env

          echo "=== Deploying Who Owns What containers ==="

          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file .env \
            -f docker-compose.prod.yml \
            up -d --build --remove-orphans

          docker image prune -f

          echo "Waiting for API health check..."
          for attempt in {1..12}; do
            if curl -fsS http://127.0.0.1:8000/api/health/ > /dev/null; then
              echo "✅ Deployment successful! Health check passed."
              exit 0
            fi
            echo "Health check not ready yet (attempt ${attempt}/12)."
            sleep 10
          done

          echo "❌ Health check failed after deployment"
          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file .env \
            -f docker-compose.prod.yml \
            logs --tail=100 api
          exit 1

      # Notify on failure
      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "❌ Backend deployment failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Backend deployment failed*\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
