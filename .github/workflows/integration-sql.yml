name: SQL Integration

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

jobs:
  sql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: wow
          POSTGRES_PASSWORD: wow
          POSTGRES_DB: wow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wow -d wow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run SQL integration tests
        run: pytest tests/test_sql.py
        env:
          SECRET_KEY: ci-secret-key
          ALERTS_API_TOKEN: ci-alerts-token
          SIGNATURE_API_TOKEN: ci-signature-token
          ADMIN_API_TOKEN: ci-admin-token
          DATABASE_URL: postgres://wow:wow@127.0.0.1:5432/wow
          TEST_DATABASE_URL: postgres://wow:wow@127.0.0.1:5432/wow_test
