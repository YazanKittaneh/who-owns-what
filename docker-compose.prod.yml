services:
  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      - POSTGRES_USER=wow
      - POSTGRES_PASSWORD=wow
      - POSTGRES_DB=wow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - wow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wow -d wow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Shared cache so rate-limit counters are consistent across the API's
  # gunicorn workers (LocMemCache is per-process and silently multiplies
  # every limit by the worker count).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - wow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend API
  api:
    image: ${API_IMAGE:-who-owns-what-api:local}
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - ALERTS_API_TOKEN=${ALERTS_API_TOKEN}
      - SIGNATURE_API_TOKEN=${SIGNATURE_API_TOKEN}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
      - ROLLBAR_ACCESS_TOKEN=${ROLLBAR_ACCESS_TOKEN}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DJANGO_CACHE_BACKEND=django.core.cache.backends.redis.RedisCache
      - DJANGO_CACHE_LOCATION=redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    image: ${FRONTEND_IMAGE:-who-owns-what-frontend:local}
    build:
      context: .
      dockerfile: client/Dockerfile.prod
      args:
        REACT_APP_API_BASE_URL: ${FRONTEND_API_BASE_URL:-https://wow-api.yazan.io}
        REACT_APP_ROLLBAR_ACCESS_TOKEN: ${FRONTEND_ROLLBAR_ACCESS_TOKEN:-}
        BUILD_GIT_SHA: ${BUILD_GIT_SHA:-unknown}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - wow-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - wow-network
    profiles:
      - with-cloudflare

  # Nginx Reverse Proxy (optional but recommended)
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
    networks:
      - wow-network
    profiles:
      - with-nginx

  # Certbot for SSL (optional)
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - with-nginx

networks:
  wow-network:
    driver: bridge

volumes:
  postgres-data:
  certbot-data:
  certbot-www:
