version: "3.8"

services:
  # Django Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: wow-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - ALERTS_API_TOKEN=${ALERTS_API_TOKEN}
      - SIGNATURE_API_TOKEN=${SIGNATURE_API_TOKEN}
      - ROLLBAR_ACCESS_TOKEN=${ROLLBAR_ACCESS_TOKEN}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    env_file:
      - .env
    networks:
      - wow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Nginx Reverse Proxy (optional but recommended)
  nginx:
    image: nginx:alpine
    container_name: wow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
    networks:
      - wow-network
    profiles:
      - with-nginx

  # Certbot for SSL (optional)
  certbot:
    image: certbot/certbot
    container_name: wow-certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - with-nginx

networks:
  wow-network:
    driver: bridge

volumes:
  certbot-data:
  certbot-www:
