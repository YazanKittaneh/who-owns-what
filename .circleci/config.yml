version: 2.0

jobs:
  test:
    working_directory: ~/who-owns-what
    docker:
      - image: justfixnyc/wow-ci:latest
        environment:
          DATABASE_URL: postgres://wow:wow@localhost/wow
      - image: cimg/postgres:13.20-postgis
        environment:
          POSTGRES_USER: wow
          POSTGRES_DB: wow
          POSTGRES_PASSWORD: wow
    steps:
      - checkout
      - restore_cache:
          key: v4-py-cache-{{ .Branch }}-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
      - run:
          name: Activate venv and install requirements
          command: |
            python3 -m venv ~/venv
            . ~/venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements-dev.txt
      - save_cache:
          name: Save python deps cache
          key: v4-py-cache-{{ .Branch }}-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
          paths:
            - ~/venv
      - run:
          name: Check python formatting
          command: |
            . ~/venv/bin/activate
            black --check .
            flake8
            mypy .
      - run:
          name: Test python code
          command: |
            . ~/venv/bin/activate            
            pytest
      - restore_cache:
          name: Restore yarn package cache
          keys:
            - yarn-packages-v3-{{ checksum "client/yarn.lock" }}
      - run:
          name: Install all node dependencies
          command: |
            cd client
            yarn install --frozen-lockfile
      - save_cache:
          name: Save yarn package cache
          key: yarn-packages-v3-{{ checksum "client/yarn.lock" }}
          paths:
            - ~/.cache/yarn
      - run:
          name: Build client and run tests
          command: |
            cd client
            yarn prettier:check
            yarn lingui compile
            # Note that CI=true in CircleCI, so this will fail if there are
            # any linter warnings.
            yarn build

            # Even though type-checking is done in 'yarn build', we want to
            # explicitly run it here, because we also want our tests and
            # any other non-production code typechecked.
            yarn typecheck

            yarn test
      - store_artifacts:
          path: test-reports
          destination: test-reports
  deploy-cloudflare:
    machine:
      enabled: true
      image: ubuntu-2004:current
    steps:
      - checkout
      - run:
          name: Install wrangler and deploy to Cloudflare Pages
          command: |
            cd client
            yarn install --frozen-lockfile
            yarn build

            # Install wrangler
            npm install -g wrangler

            # Deploy to Cloudflare Pages
            # Required env vars in CircleCI settings:
            # - CLOUDFLARE_API_TOKEN (API Token with Pages edit permission)
            # - CLOUDFLARE_ACCOUNT_ID
            # - CLOUDFLARE_PAGES_PROJECT (optional, defaults to repo name)
            wrangler pages deploy build \
              --project-name=${CLOUDFLARE_PAGES_PROJECT:-who-owns-what} \
              --branch=${CIRCLE_BRANCH} \
              --commit-dirty=true
workflows:
  version: 2
  test_and_deploy:
    jobs:
      - test
      - deploy-cloudflare:
          requires:
            - test
          filters:
            branches:
              only:
                - production
                - master
